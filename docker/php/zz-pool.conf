[www]
; Cada worker consome ~14 MB; 12 workers cabem com folga no container.
pm.max_children = 12

; Recicla workers periodicamente (proteção contra vazamento de memória).
pm.max_requests = 500

; Mata requisições travadas em vez de ocupar o worker indefinidamente.
request_terminate_timeout = 30s

; Registra stacks de requisições lentas no log do container.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
