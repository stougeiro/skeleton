[opcache]
opcache.enable=1
opcache.enable_cli=1

; Aumenta os buffers para não faltar memória pro seu roteador/kernel
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; RESOLUÇÃO DO PROBLEMA:
; Em vez de checar o disco a CADA requisição (0), checa a cada 3 segundos (3).
; Suas alterações de código ainda aparecem quase instantaneamente, 
; mas o PHP para de sufocar o disco em requisições seguidas.
opcache.validate_timestamps=1
opcache.revalidate_freq=3

; Otimizações de carregamento de código
opcache.save_comments=1
opcache.fast_shutdown=1
