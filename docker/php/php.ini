[PHP]
; Desativa funções perigosas de execução e manipulação do sistema
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source

; Esconde a versão do PHP nos cabeçalhos HTTP
expose_php = Off

; Configurações de Recursos e Upload (Alinhado com seu Nginx de 30M)
max_execution_time = 30
memory_limit = 256M
post_max_size = 30M
upload_max_filesize = 30M

; Modo Like-As-Prod: Exibe erros no HTML, mas com tratamento rígido
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
html_errors = On

date.timezone = UTC
