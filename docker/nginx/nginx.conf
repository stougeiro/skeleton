worker_processes auto;

events
{
    worker_connections 4096;
    multi_accept on;
}

http
{
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    charset utf-8;

    # Limite de upload
    client_max_body_size 30M;

    # Transferência de estáticos e timeouts anti-slowloris
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;

    # Log enxuto: origem, request, status, volume, referer, UA e tempos
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    # Muro 2: teto de taxa por IP para requisições dinâmicas (assets não contam)
    limit_req_zone $binary_remote_addr zone=app:10m rate=20r/s;

    # Compressão Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    server
    {
        listen 80 default_server;
        server_name localhost;

        root /app/public;
        index index.php index.html;

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # Excesso de requests dinâmicos: 429 (semântica de "volte depois")
        limit_req_status 429;

        # Erros gerados pelo próprio nginx: páginas estáticas em public/.
        # Sem "=" o status original é preservado (o "=" devolveria 200).
        error_page 400 /400.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 429 /429.html;
        error_page 502 503 504 /502.html;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self';" always;

        # Favicon: responde sem tocar no disco nem gerar log
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # Estáticas de erro do edge (429 leva Retry-After; as demais, no-store)
        location = /429.html {
            add_header_inherit merge;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 2 always;
        }

        location ~ ^/(400|403|404|502)\.html$ {
            add_header_inherit merge;
            add_header Cache-Control "no-store" always;
        }

        # Assets estáticos: servidos pelo nginx, sem passar pelo router
        location ~* \.(css|js|jpe?g|png|gif|ico|svg|woff2?)$ {
            # add_header no location sobrescreve o herdado; merge restaura os headers do server
            add_header_inherit merge;

            access_log off;
            log_not_found off;

            try_files $uri =404;

            expires 7d;
        }

        # Bloqueia arquivos sensíveis que possam cair em /app/public
        location ~* \.(log|ini|env|lock|md|sql|bak|dist)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloqueia o acesso a qualquer arquivo ou diretório que comece com um ponto (.)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Muro 1: assinaturas de scanner — responde no nginx, sem boot do app.
        # Lista explícita: não atinge rotas legítimas (o app só expõe /).
        location ~* ^/(?:wp-login|wp-admin|wp-content|wp-includes|xmlrpc|wp-json|wp-config|phpmyadmin|pma|myadmin|adminer|cgi-bin|vendor|composer\.(?:json|lock))(?:/|\.|$) {
            access_log off;
            log_not_found off;
            return 404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # Qualquer .php executa o front controller: o app decide o status.
        # Nenhum outro arquivo PHP é executável, logo não há vazamento de fonte.
        location ~ \.php$ {
            limit_req zone=app burst=40 nodelay;

            fastcgi_pass php:9000;
            fastcgi_index index.php;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT $document_root;

            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_temp_file_write_size 64k;

            fastcgi_intercept_errors off;
        }
    }
}
