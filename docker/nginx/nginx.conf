events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server_tokens off;
    charset utf-8;

    # Limite de upload
    client_max_body_size 30M;

    # Log customizado para segurança + performance
    log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time '
                      'uht=$upstream_header_time '
                      'urt=$upstream_response_time '
                      'uct=$upstream_connect_time '
                      'uaddr=$upstream_addr';

    # Compressão Brotli + Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # Rate limiting (proteção contra flood / abuso)
    limit_req_zone $binary_remote_addr zone=erp_limit:10m rate=5r/s;


    server {
        listen 80 default_server;
        server_name localhost;

        root /app/public;
        index index.php index.html;

        # Logs completos customizados
        access_log /var/log/nginx/access.log custom;
        error_log  /var/log/nginx/error.log warn;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data:;
            font-src 'self';
            object-src 'none';
            base-uri 'self';
        " always;


        # Cache de assets estáticos
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
            etag on;

            add_header Cache-Control "public, max-age=432000";
            add_header Vary "Accept-Encoding";
        }


        # Bloqueia o acesso a qualquer arquivo ou diretório que comece com um ponto (.)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Rota genérica simplificada
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Captura qualquer tentativa de acessar outro arquivo .php e joga pro router
        location ~ \.php$ {
            rewrite ^ /index.php last;
        }

        # Processa EXCLUSIVAMENTE o index.php central
        location = /index.php {
            fastcgi_pass php:9000;
            fastcgi_index index.php;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT $document_root;

            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_temp_file_write_size 64k;

            fastcgi_intercept_errors off;
        }
    }
}
